# Testes automáticos dos sistemas da equipe (Atendimento RD, módulos de equipe/js).
# Rodam a cada envio ao GitHub; se algum falhar, o GitHub avisa por e-mail e a mudança deve ser corrigida antes de publicar.
name: Testes da equipe
on:
  push:
    paths: ['index.html', 'equipe/**', 'dev/**', '.github/workflows/testes.yml']
  pull_request:
  workflow_dispatch:
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar Playwright
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Módulos (equipe/js)
        run: |
          node dev/atendimento/test/modulos.test.js
          node dev/atendimento/test/automacoes.test.js
          node dev/atendimento/test/financeiro.test.js
      - name: Atendimento RD no navegador
        run: |
          node dev/atendimento/test/abas.smoke.js equipe/atendimento.html | tee smoke.txt
          grep -q 'erros: \[\]' smoke.txt
          node dev/atendimento/test/qualidade.e2e.js equipe/atendimento.html
          node dev/atendimento/test/automacoes.e2e.js equipe/atendimento.html
          node dev/atendimento/test/financeiro.e2e.js equipe/atendimento.html
          node dev/atendimento/test/email.e2e.js equipe/atendimento.html
          node dev/atendimento/test/documentos.e2e.js equipe/atendimento.html
      - name: Validação de dados fiscais
        run: |
          node dev/planejatrib/test/valida_sped.test.js
          node dev/planejatrib/test/numero_br.test.js
          node dev/planejatrib/test/recupera_folha.test.js
          node dev/planejatrib/test/tema118.test.js
          python3 dev/planejatrib/valida_retencoes.py
      - name: Robô previdenciário
        run: |
          pip install --quiet openpyxl
          python3 dev/recuperacao_previdenciaria/test/test_robo.py
      - name: Roteador de modelos
        run: |
          python3 dev/roteador/roteador.py
          node dev/roteador/teste_js.js
      - name: Site
        run: node dev/site/test/site.e2e.js index.html
